name: Throughline

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: node scripts/build-dashboard.mjs --out /tmp/PROGRESS_DASHBOARD.html
